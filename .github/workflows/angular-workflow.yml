name: Angular CI/CD Workflow

on:
  push:
    branches:
      - workspace

jobs:

  # =========== Job 1: Check Files Conditions for specific file changes ===========
  check-file:
    name: Check Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout/Clone Code From Repository
        uses: actions/checkout@v4

      - name: Verify Component Selector
        run: |
          if grep -q "selector: 'app-card'" src/app/shared/component/card/card.component.ts; then
            echo "🟩🟩🟩 Selector found in card.component.ts"
          else
            echo "Selector name missing and incorrect 🞫🞫🞫"
            exit 1
          fi

  # =========== Job 2: Creating Angular Build ===========
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    needs: check-file

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Message For User
        run: echo "Code was pushed to workspace branch. Starting Angular build..."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build

      - name: Build Completed
        run: echo "Angular build completed successfully."

  # =========== Job 3: Deploying Angular Application ===========
  deploy:
    name: Deploy Angular App
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Message For User
        run: echo "Starting deployment of Angular application..."

      # Add deployment steps here
      # Example: rsync, scp, Azure, AWS, Nginx server, etc.

      - name: Deployment Completed
        run: echo "Angular application deployed successfully."
  # =========== Job 4: RollBack ===========
  rollback:
      name: Rollback
      runs-on: ubuntu-latest
      needs: check-file
      if: needs.check-file.result == 'failure'

      steps:
        - name: Message
          run: echo "Failed to check files. Initiating rollback process..."

        - name: Rollback Message
          run: echo "Check Files validation failed. Rollback initiated."

    